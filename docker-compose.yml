services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: docker_root_pw
      MYSQL_DATABASE: homework_5
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdocker_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: docker_root_pw
      DB_NAME: homework_5
      APP_BASE_URL: http://localhost:5173
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 5001
    ports:
      - "5173:5173"

volumes:
  db_data:
